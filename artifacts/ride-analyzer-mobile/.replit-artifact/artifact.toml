kind = "mobile"
previewPath = "/ride-analyzer-mobile/"
title = "Ride Analyzer Mobile"
description = "A native mobile ride recorder that tracks location, speed, distance, fuel, and traffic waiting while the phone is locked or carried in a pocket or bag."
version = "1.0.0"
id = "artifacts/ride-analyzer-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/ride-analyzer-mobile/" ]
localPort = 21620

[services.development]
run = "pnpm --filter @workspace/ride-analyzer-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ride-analyzer-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ride-analyzer-mobile", "run", "serve" ]

[services.env]
PORT = "21620"
BASE_PATH = "/ride-analyzer-mobile/"
